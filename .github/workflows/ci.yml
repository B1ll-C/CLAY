name: CI

on:
  push:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (mobile)
        run: npm run lint --workspace=mobile

      - name: Type check (mobile)
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Type check (backend)
        working-directory: backend
        run: npx tsc --noEmit

      - name: Test (mobile)
        run: npm test --workspace=mobile

      - name: Test (backend)
        run: npm test --workspace=backend
